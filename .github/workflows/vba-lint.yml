name: VBA lint

on:
  push:
    paths:
      - '**/*.bas'
      - '**/*.cls'
      - 'tools/**'
      - 'README.md'
      - '**/*.xlsx'
      - '**/*.xlsm'
      - '.gitattributes'
      - '.github/workflows/vba-lint.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Static check of VBA modules (Module1.bas)
        run: python3 tools/vba-lint.py
      - name: Number-from-text parsing spec (ЧислоИзТекста)
        run: python3 tools/parse-spec.py
      - name: Rail planner spec (TryPlanBlocks и компания)
        run: python3 tools/plan-spec.py
      - name: README procedure map vs code
        run: python3 tools/check-readme-map.py
      - name: Example.xlsm vs README and Service
        run: python3 tools/check-example.py
      - name: Mirrors, constants and README claims vs code
        run: python3 tools/check-sync.py

  windows:
    # Те же шаги на Windows одной командой: там вывод в pipe — в cp1252, а
    # чекаут — с core.autocrlf=true; на Linux ни то ни другое не проявляется.
    # В сверку шагов check-sync.py входит только джоб lint.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: All checks on Windows (tools/check-all.py)
        run: python tools/check-all.py
